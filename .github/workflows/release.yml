name: Prepare draft firmware release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  oled:
    uses: ./.github/workflows/oled.yml

  keyboard:
    runs-on: ubuntu-24.04
    container: zmkfirmware/zmk-build-arm:stable
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Build the three keyboard images
        shell: bash
        run: bash tools/build-keyboard.sh "$RUNNER_TEMP/tiny18-build"
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-release
          path: ${{ runner.temp }}/tiny18-build/firmware/*.uf2
          if-no-files-found: error

  draft:
    needs: [keyboard, oled]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/download-artifact@v4
        with:
          name: keyboard-release
          path: build/images
      - uses: actions/download-artifact@v4
        with:
          name: oled
          path: build/images
      - name: Prepare the editable OLED source package
        run: uv run --no-project python tools/export_oled_source.py --output build/OLED-SOURCE
      - name: Assemble a versioned bundle
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          uv run --no-project python tools/package_firmware.py \
            --version "$RELEASE_VERSION" --keyboard build/images \
            --oled build/images/tiny18_layer.bin \
            --licenses "firmware/LICENSE-${RELEASE_VERSION}.txt" \
            --oled-source build/OLED-SOURCE \
            --source-commit "$(git rev-parse HEAD)" --source-state clean-tag \
            --actions-run "$GITHUB_RUN_ID"

      - name: Create an unpublished draft for manual review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--draft --verify-tag)
          if [[ "$RELEASE_VERSION" == v0.* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_VERSION" "firmware/tiny18-${RELEASE_VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" --title "Tiny18 firmware ${RELEASE_VERSION}" \
            --generate-notes "${args[@]}"
