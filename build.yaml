# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
# The two right-hand images differ only in AI mode's arrow row, which
# config/tiny18.keymap picks with TINY18_PERSONAL_ARROWS. Without the define
# the arrows sit in the usual inverted T, so tiny18-right.uf2 is the image to
# hand to anybody else. The left half interprets no keymap at all, so one
# left image goes with either right one.
include:
  - board: seeeduino_xiao_ble
    shield: tiny18_r rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: tiny18-right
  - board: seeeduino_xiao_ble
    shield: tiny18_r rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DDTS_EXTRA_CPPFLAGS=-DTINY18_PERSONAL_ARROWS
    artifact-name: tiny18-right-personal
  - board: seeeduino_xiao_ble
    shield: tiny18_l rgbled_adapter
    artifact-name: tiny18-left

  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: settings-reset
