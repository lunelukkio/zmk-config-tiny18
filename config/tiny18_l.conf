#Battery config

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#Deep sleep at the stock fifteen minutes, same as the right half. Once both
#halves are in nRF52840 System OFF the radio is down too, so a key here cannot
#wake the central: waking the keyboard takes a key on the right half.
#CONFIG_ZMK_IDLE_SLEEP_TIMEOUT defaults to 900000 ms (15 minutes).
CONFIG_ZMK_SLEEP=y
