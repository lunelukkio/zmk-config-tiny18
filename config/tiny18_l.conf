#Battery config

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#Deep sleep at thirty minutes, the same figure as the right half. Both halves
#must carry the same timeout: the shorter one would drop out first and the
#board would behave differently depending on which half fell asleep. Once both
#are in nRF52840 System OFF the radio is down too, so a key here cannot wake
#the central: waking the keyboard takes a key on the right half.
#The stock value is 900000 ms (15 minutes); this doubles it and costs battery.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
