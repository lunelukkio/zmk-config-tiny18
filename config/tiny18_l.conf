#Battery config

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#Deep sleep on this half only. The central stays awake so that a keypress
#here wakes this half and reconnects without touching the right hand.
#CONFIG_ZMK_IDLE_SLEEP_TIMEOUT defaults to 900000 ms (15 minutes).
CONFIG_ZMK_SLEEP=y
