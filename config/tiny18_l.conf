#Battery config

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#No deep sleep (v0.8.4, 2026-10-22), the same as the right half. Up to v0.8.3
#both halves entered nRF52840 System OFF after one hour, and once both were off
#a key here could not wake the central. Staying awake keeps the link to the
#central up, so the first keypress after a pause is delivered. Keep this in
#step with tiny18_r.conf: if only one half slept, the keyboard would behave
#differently depending on which half it was. This half has no mode LED, so the
#stock idle timeout stays.
CONFIG_ZMK_SLEEP=n
