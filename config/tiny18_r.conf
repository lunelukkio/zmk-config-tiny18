#Battery config
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y


CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_BT_BAS=y

#Layer LED config
#0 black / 1 red / 2 green / 3 yellow / 4 blue / 5 magenta / 6 cyan / 7 white
#LAYER_N_COLOR is indexed by the real layer number, and the widget shows the
#highest active layer. Miscounting the two held layers is how the number layer
#lit cyan until 2026-09-11; there is no layer 8, so no LAYER_8_COLOR.
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
#Modes you stay in each get their own colour.
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=1
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=4
#Layers 3 and 4 exist only while a thumb is held, and both open from the text
#layer and the AI layer, so neither mode's colour fits. White means "a held
#page is open" and belongs to no mode.
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=7
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=7
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=3
CONFIG_RGBLED_WIDGET_LAYER_7_COLOR=5

#Deep sleep on both halves at the stock fifteen minutes, battery chosen over
#convenience. Verified on hardware 2026-09-11: once both halves reach nRF52840
#System OFF the radio is down, so the left half cannot wake the central. Waking
#the board means pressing a key on this half and waiting two to three seconds
#for the reboot and reconnect, and that keypress is lost.
#CONFIG_ZMK_IDLE_SLEEP_TIMEOUT defaults to 900000 ms (15 minutes).
CONFIG_ZMK_SLEEP=y

#ZMK Studio config
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
