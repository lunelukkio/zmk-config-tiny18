#Battery config
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y


CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_BT_BAS=y

#Layer LED config
#0 black / 1 red / 2 green / 3 yellow / 4 blue / 5 magenta / 6 cyan / 7 white
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=1
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=4
#Layer 3 is held from inside the AI layer, so keep it that layer's blue, and
#layers 4-5 are held while typing, so keep them the base layer's green. The
#colour then names the mode you are in and nothing else.
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=2
#Modes you stay in each get their own colour: green text entry, blue AI,
#cyan game, yellow number, magenta function keys. Bluetooth is red on layer 1.
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_7_COLOR=3
CONFIG_RGBLED_WIDGET_LAYER_8_COLOR=5

#Deep sleep on both halves at the stock fifteen minutes, battery chosen over
#convenience. Verified on hardware 2026-09-11: once both halves reach nRF52840
#System OFF the radio is down, so the left half cannot wake the central. Waking
#the board means pressing a key on this half and waiting two to three seconds
#for the reboot and reconnect, and that keypress is lost.
#CONFIG_ZMK_IDLE_SLEEP_TIMEOUT defaults to 900000 ms (15 minutes).
CONFIG_ZMK_SLEEP=y

#ZMK Studio config
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
