#Battery config
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y


CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_BT_BAS=y

#Layer LED config
#0 black / 1 red / 2 green / 3 yellow / 4 blue / 5 magenta / 6 cyan / 7 white
#LAYER_N_COLOR is indexed by the real layer number, and the controller shows the
#highest active layer. Miscounting the two held layers is how the number layer
#lit cyan until 2026-09-11; there is no layer 8, so no LAYER_8_COLOR.
# Use the Tiny18 controller on the right. The left keeps the upstream widget.
CONFIG_RGBLED_WIDGET=n
CONFIG_TINY18_LED_INDICATOR=y
CONFIG_PWM=y
CONFIG_LED_PWM=y
#Modes you stay in each get their own colour: 0 text entry, 1 Bluetooth,
#2 AI, 3 number keypad, 4 function, 5 game.
CONFIG_TINY18_LED_LAYER_0_COLOR=2
CONFIG_TINY18_LED_LAYER_1_COLOR=1
CONFIG_TINY18_LED_LAYER_2_COLOR=4
CONFIG_TINY18_LED_LAYER_3_COLOR=3
CONFIG_TINY18_LED_LAYER_4_COLOR=5
CONFIG_TINY18_LED_LAYER_5_COLOR=6
#Layers 6 and 7 exist only while a thumb is held, and they open from every
#mode, so no mode's colour fits. White means "a held page is open" and
#belongs to no mode. They carry the two highest numbers so that they show
#through every mode: ZMK resolves a key from the highest active layer down.
CONFIG_TINY18_LED_LAYER_6_COLOR=7
CONFIG_TINY18_LED_LAYER_7_COLOR=7
CONFIG_TINY18_LED_LAYER_8_COLOR=7

#No deep sleep (v0.8.4, 2026-10-22). Up to v0.8.3 both halves entered nRF52840
#System OFF after one hour of inactivity. Waking was a reboot: each half had to
#be woken by its own key, the left half could not wake the central, the wake
#keypress was lost and the reconnect took two to three seconds. Staying in
#ZMK's idle state keeps the radio and the key interrupts alive, so the first
#keypress after any pause is delivered at once. The cost is battery: idle keeps
#both Bluetooth links up. The learning display has its own USB power and blanks
#itself after one hour without a frame, so it needs no change.
CONFIG_ZMK_SLEEP=n
#ZMK's idle state is used only by the mode LED here: thirty minutes without a
#keypress turns the LED off, and the next keypress turns it back on. The stock
#idle timeout is 30000 ms (30 seconds); nothing else in this build reacts to it.
CONFIG_ZMK_IDLE_TIMEOUT=1800000

#ZMK Studio config
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# External USB-powered learning display. UART1 uses D1 as TX only and sends
# the current layer number when it changes; it does not share keyboard power.
CONFIG_TINY18_LAYER_UART=y

# Begin every central-side boot in AI mode (power-on and reset). There is no
# deep sleep, so a pause does not bring the keyboard back to AI mode.
CONFIG_TINY18_START_IN_AI=y
