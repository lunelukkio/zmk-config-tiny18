#Battery config
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y


CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_BT_BAS=y

#Layer LED config
#0 black / 1 red / 2 green / 3 yellow / 4 blue / 5 magenta / 6 cyan / 7 white
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=1
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=4
#Layers 3-5 are held from inside the AI layer, so keep them its blue. The
#colour then names the mode you are in and nothing else.
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=4
#Layers 6-7 are momentary holds used while typing, so keep them the same
#green as layer 0. Left at their defaults the LED would change colour every
#time a thumb layer is pressed.
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_7_COLOR=2
#Modes you stay in each get their own colour: green text entry, blue AI,
#cyan game, yellow number, magenta function keys. Bluetooth is red on layer 1.
CONFIG_RGBLED_WIDGET_LAYER_8_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_9_COLOR=3
CONFIG_RGBLED_WIDGET_LAYER_10_COLOR=5

#No deep sleep on this half. Verified on hardware 2026-09-11: once both halves
#reach nRF52840 System OFF the radio is down, so a keypress on the left cannot
#wake the central and only a right-hand key brings the board back - unusable
#with a trackball under that hand. Keeping the central awake lets a left
#keypress wake the left half and reconnect on its own. The cost is this half's
#battery, since the layer LED also stays lit.
CONFIG_ZMK_SLEEP=n

#ZMK Studio config
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
